server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # API calls go to the backend container, so the browser sees one origin: no CORS,
    # and the refresh-token cookie (path /api/auth) is a first-party cookie.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Built files carry a content hash in their names, so browsers may keep them.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Every other path (e.g. /app/payments) is a page of the app: serve index.html and let the router show it.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
