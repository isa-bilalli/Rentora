# The whole app on one machine: PostgreSQL, the backend and the frontend, at http://localhost:3000.
# Needs JWT_SECRET (at least 32 characters) from the shell or a .env file next to this one, then:
#   docker compose up --build
name: rentora

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: rentora
      POSTGRES_USER: rentora
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rentora}
    volumes:
      # PostgreSQL 18 images keep their data in a versioned folder under this path.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rentora -d rentora"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/rentora
      DB_USERNAME: rentora
      DB_PASSWORD: ${POSTGRES_PASSWORD:-rentora}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET (at least 32 characters) in the shell or in a .env file next to docker-compose.yml}
      # Milliseconds: 15 minutes and 7 days.
      JWT_EXPIRATION: ${JWT_EXPIRATION:-900000}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-604800000}
      # The browser only ever talks to the frontend's origin; nginx forwards /api here.
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      # Compose serves plain HTTP. Behind HTTPS, remove this so the prod profile's secure cookies apply.
      COOKIE_SECURE: "false"
      # The container's clock is UTC; the backend keeps this zone's days instead.
      APP_TIME_ZONE: ${APP_TIME_ZONE:-Europe/Belgrade}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres-data:
