# Production settings, on top of application.yml. Turn on with SPRING_PROFILES_ACTIVE=prod.

cors:
  # Required. Left unset it is empty, and an empty list stops startup.
  # (A placeholder without a default would not: Spring would keep "${CORS_ALLOWED_ORIGINS}" as the origin.)
  allowed-origins: ${CORS_ALLOWED_ORIGINS:}

cookie:
  # The refresh-token cookie is HTTPS-only unless COOKIE_SECURE=false.
  secure: ${COOKIE_SECURE:true}

server:
  # Requests arrive through the frontend's nginx, which adds X-Forwarded-For. Tomcat takes the visitor's
  # address from it, but only when the request comes from a private-network proxy like nginx, so it can't be
  # faked from outside. Without this every visitor would share nginx's address, and the login limit per
  # address would lock everyone out together.
  forward-headers-strategy: native
