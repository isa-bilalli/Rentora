spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION}

app:
  # Decides what day it is everywhere: when leases start and end, what is overdue, and when the nightly
  # lease job runs (00:05 in this zone).
  time-zone: ${APP_TIME_ZONE:Europe/Belgrade}

# Local defaults. The prod profile (application-prod.yml) changes them.
cors:
  # Comma-separated, e.g. https://app.example.com,https://admin.example.com
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

cookie:
  # Off locally because the dev servers use plain HTTP.
  secure: ${COOKIE_SECURE:false}
